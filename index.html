<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="A self-updating dashboard of all your GitHub Pages apps." />
  <title>App Launcher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="App Launcher" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>App Launcher</h1>
    <button type="button" class="refresh-btn" title="Reload the app list from GitHub Pages" aria-label="Reload app list" aria-busy="false">
      <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M1 4v6h6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.5 15a9 9 0 1 0 2.1-9.9L1 10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <input id="search" type="search" placeholder="Search apps…  (press /)" autocomplete="off" spellcheck="false" />
  </header>

  <main id="grid" class="grid"></main>

  <div id="empty" class="empty" hidden>
    <p id="emptyMsg"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
