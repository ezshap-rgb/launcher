<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="A self-updating dashboard of all your GitHub Pages apps." />
  <title>App Launcher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="App Launcher" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>App Launcher</h1>
    <input id="search" type="search" placeholder="Search apps…  (press /)" autocomplete="off" spellcheck="false" />
  </header>

  <main id="grid" class="grid"></main>

  <div id="empty" class="empty" hidden>
    <p id="emptyMsg"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
